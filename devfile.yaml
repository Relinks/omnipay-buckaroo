schemaVersion: 2.2.0
metadata:
  name: omnipay-buckaroo
  architectures:
    - amd64
    - arm64

projects:
  - name: omnipay-buckaroo
    git:
      remotes:
        origin: https://github.com/Relinks/omnipay-buckaroo.git
      checkoutFrom:
        revision: master

commands:
  - id: install-composer
    exec:
      component: tools
      commandLine: composer install
      group:
        isDefault: true
        kind: build
      workingDir: ${PROJECT_SOURCE}

components:
  - name: tools
    attributes:
      controller.devfile.io/merge-contribution: true
    container:
      image: 444685429404.dkr.ecr.eu-west-1.amazonaws.com/developer-image/universal:v20251229
      memoryRequest: 1Gi
      memoryLimit: 1Gi
      mountSources: true
